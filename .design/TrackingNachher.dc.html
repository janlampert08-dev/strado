<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fafafa; color: #131316; }
    a { color: #3d5afe; } a:hover { color: #2f49d6; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .mess { position: absolute; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px;
            font-weight: 600; color: #1a7f37; background: #fafafa; padding: 1px 5px; border-radius: 4px;
            border: 1px solid #1a7f37; white-space: nowrap; z-index: 5; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fafafa;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 272px; background: #eceff1;">
    <svg viewBox="0 0 390 572" style="width: 100%; height: 100%;" aria-hidden="true">
      <path d="M-10 430 C 70 400, 110 300, 180 270 S 300 180, 400 90" fill="none" stroke="rgba(61,90,254,.3)" stroke-width="5" stroke-linecap="round"/>
      <path d="M-10 430 C 70 400, 110 300, 180 270" fill="none" stroke="#3D5AFE" stroke-width="5" stroke-linecap="round"/>
      <circle cx="180" cy="270" r="9" fill="#3d5afe" stroke="#fafafa" stroke-width="3"/>
    </svg>
    <!-- Wachhinweis als Pille auf der Karte, nicht als Fussnote -->
    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; border-radius: 999px; background: rgba(250,250,250,.94); border: 1px solid rgba(19,19,22,.12); padding: 10px 16px;">
      <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: #b45309; fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0;" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
      <span style="font-size: 14px; line-height: 1.35;">Bildschirm an lassen — sonst pausiert die Aufzeichnung.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 272px; border-top: 1px solid rgba(19,19,22,.30); background: #fafafa; padding: 16px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #dc2626;"></span>
      <p class="mono" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #666b74;">Aufzeichnung läuft</p>
    </div>

    <div style="height: 10px;"></div>

    <!-- Zwei Zahlen gross -->
    <div style="display: flex; align-items: flex-end; gap: 24px; position: relative;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; color: #666b74;">Zeit</span>
        <span class="mono" style="font-size: 44px; font-weight: 600; line-height: 1;">11:24</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; color: #3d5afe;">noch</span>
        <span class="mono" style="font-size: 44px; font-weight: 600; line-height: 1; color: #3d5afe;">5.8</span>
      </div>
      <span style="font-size: 15px; color: #3d5afe; padding-bottom: 4px;">km</span>
    </div>

    <span class="mess" style="right: 16px; top: 50px;">zwei Zahlen statt fünf</span>

    <div style="height: 12px;"></div>
    <p style="margin: 0; font-size: 15px; color: #666b74;">8.40 km gefahren &middot; 62 km/h &middot; 640 m</p>

    <div style="height: 16px;"></div>

    <div style="display: flex; gap: 10px; position: relative;">
      <span style="display: flex; flex-grow: 1; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; background: #3d5afe; color: #fafafa; font-size: 16px; font-weight: 500;">
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: #fafafa; fill: #fafafa;" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        Beenden
      </span>
    </div>
    <span class="mess" style="left: 16px; top: 246px;">fragt nach, solange die Strecke nicht zu Ende ist</span>

  </div>

</div>
</x-dc>
</body>
</html>
