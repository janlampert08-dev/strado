  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fafafa; color: #131316; }

    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px; flex: 1 1 0; }
    .tl { font-size: 10px; font-weight: 500; }
    .mess { position: absolute; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px;
            font-weight: 600; color: #1a7f37; background: #fafafa; padding: 1px 5px; border-radius: 4px;
            border: 1px solid #1a7f37; white-space: nowrap; z-index: 5; }
    .row { display: flex; align-items: center; gap: 12px; height: 80px; border-left: 3px solid #3d5afe;
           padding: 0 8px 0 12px; border-bottom: 1px solid rgba(19,19,22,.12); }
  </style>
</helmet>
