name: CI

on:
  # Bewusst ohne branches-Filter: der Filter gilt für den ZIEL-Branch eines
  # Pull Requests, nicht für den Quell-Branch. Mit `branches: [main]` lief
  # auf einem PR, der auf einen anderen Branch zeigt, überhaupt keine CI —
  # ein gestapelter PR (Folgearbeit, die auf einem noch offenen PR aufbaut)
  # war damit still ungeprüft, und das nachträgliche Umhängen auf main holt
  # den Lauf nicht nach: das erzeugt nur ein `edited`-Event, das den
  # Workflow nicht auslöst. Genau so ist #113 ohne CI gemergt worden.
  # Jeder PR wird geprüft, egal wohin er zeigt.
  pull_request:
  # Hier bleibt der Filter richtig: gemeint ist der Branch, auf den
  # geschoben wurde. Nur main soll einen eigenen Lauf ausserhalb von PRs
  # bekommen — Pushes auf Feature-Branches sind bereits über deren PR
  # abgedeckt.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholder values only — not real credentials. `next build`
      # evaluates lib/stripe.ts and the Supabase client factories at module
      # load time (during static page-data collection), so they need to be
      # non-empty strings, but no network calls to Supabase/Stripe/Mapbox
      # happen during a production build. Real secrets are configured in
      # the deployment platform (Vercel), never here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SECRET_KEY: placeholder-secret-key
      NEXT_PUBLIC_MAPBOX_TOKEN: placeholder-mapbox-token
      STRIPE_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PREMIUM_PRICE_ID: price_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Migrationspräfixe prüfen
        # Läuft vor Lint/Test/Build, weil eine Kollision unabhängig vom
        # Anwendungscode ist und der Fehler sonst hinter einem langen
        # Build-Log verschwindet.
        run: node scripts/check-migration-prefixes.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
